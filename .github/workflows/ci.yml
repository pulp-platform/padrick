name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          # setuptools_scm derives the package version from git tags
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Run tests with coverage
        run: |
          uv run pytest tests/characterization --cov=padrick --cov-report=term --cov-report=xml \
            | tee /tmp/pytest-coverage.txt
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
      - name: Add coverage to step summary
        if: always()
        run: |
          echo '### Coverage (Python ${{ matrix.python-version }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/pytest-coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: fsfe/reuse-action@v6
