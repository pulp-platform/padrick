name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the package version from git tags
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # the PyScaffold 3.2 build needs legacy tooling and no build isolation
      - run: pip install "setuptools<81" "pyscaffold>=3.2,<3.3" wheel
      - run: pip install --no-build-isolation -e . pytest
      - run: pytest tests/characterization

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
