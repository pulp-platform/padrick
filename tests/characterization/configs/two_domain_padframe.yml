# Two-domain padframe used by tests/characterization/test_config_interface.py to
# exercise the per_domain config port topology (one config bus per pad domain).
name: twodom_padframe
manifest_version: 5
config_port_topology: per_domain
pad_domains:
  - name: domain0
    pad_types:
      - name: gpio_pad
        template: |
          GPIO ${instance_name} (.PAD(${conn["pad"]}), .O(${conn["pad2chip"]}), .I(${conn["chip2pad"]}), .OE(${conn["out_en"]}));
        pad_signals:
          - name: chip2pad
            size: 1
            kind: input
            conn_type: dynamic
            default_reset_value: 0
            default_static_value: 1'b0
          - name: out_en
            size: 1
            kind: input
            conn_type: dynamic
            default_reset_value: 0
            default_static_value: 1'b0
          - name: pad2chip
            size: 1
            kind: output
            conn_type: dynamic
            default_static_value: ~
          - name: pad
            size: 1
            kind: pad
    pad_list:
      - name: gpio0
        pad_type: gpio_pad
        mux_groups: [all]
    port_groups:
      - name: gpio
        output_defaults:
          data_o: 1'b0
        ports:
          - name: p0
            mux_groups: [all]
            connections:
              chip2pad: data_i
              out_en: en_i
              data_o: pad2chip
  - name: domain1
    pad_types:
      - name: gpio_pad
        template: |
          GPIO ${instance_name} (.PAD(${conn["pad"]}), .O(${conn["pad2chip"]}), .I(${conn["chip2pad"]}), .OE(${conn["out_en"]}));
        pad_signals:
          - name: chip2pad
            size: 1
            kind: input
            conn_type: dynamic
            default_reset_value: 0
            default_static_value: 1'b0
          - name: out_en
            size: 1
            kind: input
            conn_type: dynamic
            default_reset_value: 0
            default_static_value: 1'b0
          - name: pad2chip
            size: 1
            kind: output
            conn_type: dynamic
            default_static_value: ~
          - name: pad
            size: 1
            kind: pad
    pad_list:
      - name: gpio0
        pad_type: gpio_pad
        mux_groups: [all]
    port_groups:
      - name: gpio
        output_defaults:
          data_o: 1'b0
        ports:
          - name: p0
            mux_groups: [all]
            connections:
              chip2pad: data_i
              out_en: en_i
              data_o: pad2chip
